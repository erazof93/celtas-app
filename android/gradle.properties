org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Kotlin de AGP 9 (Built-in Kotlin). En `true` (el default real de AGP 9),
# `firebase_core >= 4.x` detecta el flag y NO aplica su propio Kotlin Gradle
# Plugin en tiempo de build — así el proyecto queda del lado correcto del
# breaking change de Flutter ("future versions will fail if plugins apply KGP").
# Nota: el WARNING de `flutter build` sobre `firebase_core` SIGUE saliendo
# porque Flutter detecta el KGP escaneando el `build.gradle` del plugin con
# regex (ve el `apply plugin: 'kotlin-android'` que firebase_core deja dentro
# de un `if (!builtInKotlin)`), no evaluando el build real. Es cosmético: el
# AAB se genera bien. Se irá cuando firebase_core publique un build.gradle sin
# esa línea suelta, o cuando Flutter afine la detección.
android.builtInKotlin=true
# Workaround permanente para desarrollo en Windows: el compilador de Kotlin
# (Build Tools API) falla al cerrar sus cachés incrementales cuando el
# pub-cache (normalmente en C:) y el proyecto (ej. D:) están en discos
# distintos — RelocatableFileToPathConverter no puede calcular una ruta
# relativa entre raíces de unidad distintas. Sin esto, `flutter run` no
# compila en Windows con esta disposición de carpetas.
kotlin.incremental=false
