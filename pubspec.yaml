name: celtas_mobile
description: "App cliente de Celtas — dark kitchen delivery. Consume backend-celtas.onrender.com."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.11.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^2.6.1
