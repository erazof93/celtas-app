name: celtas_mobile
description: Aplicación móvil oficial de Celtas Fast Food para pedidos a domicilio."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  confetti: ^0.8.0
  dio: ^5.11.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.0
  flutter_map: ^8.3.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.4.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  permission_handler: ^13.0.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^3.2.4
  google_sign_in_platform_interface: ^3.1.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/branding/iconos.svg

# Fuente del logo: assets/branding/ — ver ROADMAP.md (módulo 10) para el procedimiento de
# actualización. Los PNG de flutter_launcher_icons/flutter_native_splash no se listan acá porque
# esos paquetes los leen directo de esta ruta al generar, no se empaquetan en el build. iconos.svg
# sí se lista porque se carga en runtime con flutter_svg (ícono de marca dentro de la app).
flutter_launcher_icons:
  image_path: "assets/branding/logomarcaios.png"
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "assets/branding/logobackground.png"
  adaptive_icon_foreground: "assets/branding/logomarcalienzotransparente.png"
  ios: true
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0D0D0D"
  image: "assets/branding/logo1024splash.png"
  android: true
  ios: true
  android_12:
    color: "#0D0D0D"
    # Android 12+ recorta el ícono del splash a la "zona segura" de un adaptive icon (~55% del
    # ancho del canvas) — el logo original (logo1024splash.png) llega borde a borde, sin margen,
    # y queda cortado ("C"/"S" fuera de cuadro, confirmado en dispositivo real). Este archivo
    # (generado con Pillow a partir del original) es un canvas cuadrado 1024x1024 con el mismo
    # logo centrado y relleno transparente, ocupando ~48% del ancho, para que quede dentro de
    # esa zona segura.
    image: "assets/branding/logo1024splash_android12.png"
